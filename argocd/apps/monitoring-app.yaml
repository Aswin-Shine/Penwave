apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: penwave-monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Aswin-Shine/Penwave.git
    targetRevision: kubernetes
    path: monitoring-k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
