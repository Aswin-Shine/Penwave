apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: penwave-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Aswin-Shine/Penwave.git
    targetRevision: kubernetes
    path: argocd/apps
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true