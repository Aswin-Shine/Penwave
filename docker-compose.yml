name: penwave

# ─────────────────────────────────────────────────────────
# Penwave Platform — Docker Compose
# Usage: docker compose up -d
# ─────────────────────────────────────────────────────────

services:

  # ──────────────────────────────────────────
  # Nginx — Single entry point / reverse proxy
  # ──────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: penwave-nginx
    ports:
      - "8080:80"
    volumes:
      - ./local-setup/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./local-setup/nginx/proxy_params:/etc/nginx/proxy_params:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - public_net
      - app_net
    labels:
      logging: "promtail"
      service: "nginx"

  # ──────────────────────────────────────────
  # Frontend — Next.js
  # ──────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
    container_name: penwave-frontend
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost/api}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    networks:
      - app_net
    labels:
      logging: "promtail"
      service: "frontend"
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache

  # ──────────────────────────────────────────
  # Backend — Node.js / Express / Prisma
  # ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: penwave-backend
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-penwave}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-penwave}?schema=public
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - COOKIE_SECRET=${COOKIE_SECRET}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 3
    restart: unless-stopped
    networks:
      - app_net
      - data_net
    labels:
      logging: "promtail"
      service: "backend"
    read_only: true
    tmpfs:
      - /tmp

  # ──────────────────────────────────────────
  # PostgreSQL
  # ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: penwave-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-penwave}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-penwave}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./local-setup/scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-penwave} -d ${POSTGRES_DB:-penwave}"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped
    networks:
      - data_net
    labels:
      logging: "promtail"
      service: "postgres"
    # No external port exposure — access only via app_net

  # ──────────────────────────────────────────
  # Redis
  # ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: penwave-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - data_net
    labels:
      service: "redis"

  # ──────────────────────────────────────────
  # Prometheus
  # ──────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: penwave-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    volumes:
      - ./local-setup/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./local-setup/monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - ./local-setup/monitoring/prometheus/metrics_secret:/etc/prometheus/metrics_secret:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - monitoring_net
      - app_net
    labels:
      service: "prometheus"

  # ──────────────────────────────────────────
  # Grafana
  # ──────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.3.0
    container_name: penwave-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-changeme}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3002
      - GF_LOG_MODE=console
      - GF_LOG_LEVEL=warn
    volumes:
      - ./local-setup/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./local-setup/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3002:3000"
    depends_on:
      - prometheus
      - loki
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    networks:
      - monitoring_net
    labels:
      service: "grafana"

  # ──────────────────────────────────────────
  # Loki — Log aggregation
  # ──────────────────────────────────────────
  loki:
    image: grafana/loki:3.2.0
    container_name: penwave-loki
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./local-setup/monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - monitoring_net
    labels:
      service: "loki"

  # ──────────────────────────────────────────
  # Promtail — Log shipper
  # ──────────────────────────────────────────
  promtail:
    image: grafana/promtail:3.2.0
    container_name: penwave-promtail
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./local-setup/monitoring/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - nginx_logs:/var/log/nginx:ro
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - monitoring_net
    labels:
      service: "promtail"

  # ──────────────────────────────────────────
  # DB Migration runner (one-shot)
  # ──────────────────────────────────────────
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: penwave-migrate
    command: ["sh", "-c", "npx prisma migrate deploy && echo 'Migrations complete'"]
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-penwave}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-penwave}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data_net
    restart: "no"
    profiles:
      - migrate

# ──────────────────────────────────────────
# Networks — explicit, least-privilege
# ──────────────────────────────────────────
networks:
  public_net:
    driver: bridge
    name: penwave_public

  app_net:
    driver: bridge
    name: penwave_app
    internal: false

  data_net:
    driver: bridge
    name: penwave_data
    internal: true  # Databases not reachable from public internet

  monitoring_net:
    driver: bridge
    name: penwave_monitoring

# ──────────────────────────────────────────
# Volumes — named, persistent
# ──────────────────────────────────────────
volumes:
  postgres_data:
    name: penwave_postgres_data
  redis_data:
    name: penwave_redis_data
  prometheus_data:
    name: penwave_prometheus_data
  grafana_data:
    name: penwave_grafana_data
  loki_data:
    name: penwave_loki_data
  nginx_logs:
    name: penwave_nginx_logs
