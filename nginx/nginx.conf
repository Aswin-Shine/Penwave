user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
  use epoll;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format json_combined escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
    '"method":"$request_method","uri":"$request_uri",'
    '"status":$status,"bytes_sent":$bytes_sent,'
    '"request_time":$request_time,"http_user_agent":"$http_user_agent"}';

  access_log /var/log/nginx/access.log json_combined;
  sendfile on; tcp_nopush on; tcp_nodelay on;
  keepalive_timeout 65; server_tokens off;
  client_max_body_size 10m;

  gzip on; gzip_vary on; gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/javascript application/json;

  limit_req_zone $binary_remote_addr zone=general:10m rate=60r/m;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=api:10m rate=120r/m;

  upstream frontend { server frontend:3000; keepalive 32; }
  upstream backend  { server backend:4000;  keepalive 32; }
  upstream grafana  { server grafana:3000;  keepalive 8;  }

  # HTTP → HTTPS redirect (and ACME challenge pass-through)
  server {
    listen 80;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }

  # Main app
  server {
    listen 443 ssl http2;
    server_name PENWAVE_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/PENWAVE_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/PENWAVE_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/auth    { limit_req zone=auth    burst=5  nodelay; proxy_pass http://backend;  include /etc/nginx/proxy_params; }
    location /api/        { limit_req zone=api     burst=20 nodelay; proxy_pass http://backend;  include /etc/nginx/proxy_params; }
    location /metrics     { deny all; }
    location /_next/static/ { proxy_pass http://frontend; add_header Cache-Control "public, max-age=31536000, immutable"; include /etc/nginx/proxy_params; }
    location /            { limit_req zone=general burst=20 nodelay; proxy_pass http://frontend; include /etc/nginx/proxy_params; }
  }

  # API subdomain
  server {
    listen 443 ssl http2;
    server_name api.PENWAVE_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/PENWAVE_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/PENWAVE_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / { limit_req zone=api burst=20 nodelay; proxy_pass http://backend; include /etc/nginx/proxy_params; }
  }

  # Grafana subdomain
  server {
    listen 443 ssl http2;
    server_name grafana.PENWAVE_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/PENWAVE_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/PENWAVE_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
      proxy_pass http://grafana;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
