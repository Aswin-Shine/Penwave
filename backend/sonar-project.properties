# SONAR_ORG and the projectKey below are placeholders -- you get the real
# values from sonarcloud.io after creating the org/project there (free for
# public repos). Log in with GitHub, "Analyze new project", pick this repo.
# SonarCloud shows you the exact projectKey/organization strings to use
# once the project exists -- don't guess them, copy from there.
sonar.projectKey=Aswin-Shine_Penwave
sonar.organization=aswin-shine

sonar.sources=src
sonar.exclusions=**/*.test.ts,**/node_modules/**,**/dist/**

