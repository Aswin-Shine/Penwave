# ─────────────────────────────────────────────────────────────────────────────
# ExternalSecret: penwave-backend-connection-strings
#
# REPLACES the original connection-strings-secret.yaml, which was a
# manually-applied Secret with REPLACE_WITH_* placeholders committed to
# git and an explicit "do not apply this file as-is" comment.
#
# WHY THAT WAS A PROBLEM FOR "FULL AUTOMATION": this file lives inside
# the path ArgoCD watches. With selfHeal: true, ArgoCD does not just fail
# to help on a fresh cluster -- it actively HURTS an already-working one.
# If someone manually created the real secret by hand (following the
# original file's own kubectl instructions), ArgoCD compares the live
# Secret against git, sees a mismatch, and overwrites it back to the
# REPLACE_WITH_* placeholder strings. The backend and migration hook would
# start failing with literal placeholder text as their DB password --
# self-inflicted, and only after everything was working.
#
# THE FIX: DB_PASSWORD and REDIS_AUTH_TOKEN already sync automatically via
# the ExternalSecret above (external-secret.yaml) -- they're genuinely
# secret. RDS/Redis ENDPOINT HOSTNAMES are not secret at all -- they're
# DNS names, safe to commit to git same as any other config value. This
# ExternalSecret's `target.template` combines the real password (fetched
# live from Secrets Manager, never touches git) with the endpoint
# hostname (static, safe to commit) into the final DATABASE_URL/REDIS_URL
# strings the backend actually needs.
#
# ONE MANUAL FILL-IN REQUIRED, ONE TIME: replace RDS_ENDPOINT_PLACEHOLDER
# and REDIS_ENDPOINT_PLACEHOLDER below with the real values from
# `terraform output rds_endpoint` / `terraform output redis_endpoint`.
# These are stable infrastructure values, not secrets -- they don't rotate
# per-deploy the way passwords do, so this is a one-time edit per
# environment, not a recurring manual step like the original file required.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: penwave-backend-connection-strings
  namespace: penwave
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: penwave-backend-connection-strings
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgresql://penwave:{{ .DB_PASSWORD }}@penwave-postgres-prod.cq308g48632s.us-east-1.rds.amazonaws.com:5432/penwave"
        REDIS_URL: "rediss://default:{{ .REDIS_AUTH_TOKEN }}@master.penwave-redis-prod.3iucec.use1.cache.amazonaws.com:6379"

  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: penwave/prod/app-secrets
        property: DB_PASSWORD
    - secretKey: REDIS_AUTH_TOKEN
      remoteRef:
        key: penwave/prod/app-secrets
        property: REDIS_AUTH_TOKEN
