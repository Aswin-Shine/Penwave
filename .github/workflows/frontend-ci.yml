# ─────────────────────────────────────────────────────────────────────────────
# Frontend CI. Same pattern as backend-ci.yml -- see that file for the
# same-repo cross-branch explanation and the full scan-policy reasoning
# (why SonarCloud is report-only, why Trivy only gates on CRITICAL).
#
# NO BUILD-ARG. BACKEND_URL is a runtime env var set in the kubernetes
# branch's frontend/deployment.yaml, not baked at build time.
#
# REQUIRED SECRETS: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN, SONAR_TOKEN
# (can reuse the same SonarCloud token as backend, different project key).
# ─────────────────────────────────────────────────────────────────────────────
name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: write
  security-events: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (app source)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set image tag
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: SonarCloud scan (report-only)
        uses: SonarSource/sonarqube-scan-action@v4
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: frontend

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            aswinshine/penwave-frontend:${{ steps.vars.outputs.sha_short }}
            aswinshine/penwave-frontend:latest

      - name: Trivy image scan (report all severities to Security tab)
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: aswinshine/penwave-frontend:${{ steps.vars.outputs.sha_short }}
          format: sarif
          output: trivy-image-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true

      - name: Upload Trivy results to Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-image-results.sarif

      - name: Trivy image scan (gate on CRITICAL only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: aswinshine/penwave-frontend:${{ steps.vars.outputs.sha_short }}
          format: table
          severity: CRITICAL
          exit-code: 1
          ignore-unfixed: true

      - name: Checkout kubernetes branch
        uses: actions/checkout@v7
        with:
          ref: kubernetes
          path: manifests

      - name: Update manifest with new image tag
        run: |
          sed -i "s|image: \"aswinshine/penwave-frontend:.*\"|image: \"aswinshine/penwave-frontend:${{ steps.vars.outputs.sha_short }}\"|" manifests/k8s/manifests/frontend/deployment.yaml

      - name: Commit and push to kubernetes branch
        working-directory: manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/manifests/frontend/deployment.yaml
          git diff --cached --quiet || git commit -m "ci: bump frontend image to ${{ steps.vars.outputs.sha_short }} (from main@${{ github.sha }})"
          git push origin kubernetes