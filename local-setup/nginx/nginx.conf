user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
  use epoll;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # ── Logging ──────────────────────────────────────────────
  log_format json_combined escape=json
    '{'
      '"time":"$time_iso8601",'
      '"remote_addr":"$remote_addr",'
      '"request_id":"$http_x_request_id",'
      '"method":"$request_method",'
      '"uri":"$request_uri",'
      '"status":$status,'
      '"bytes_sent":$bytes_sent,'
      '"request_time":$request_time,'
      '"upstream_time":"$upstream_response_time",'
      '"http_referrer":"$http_referer",'
      '"http_user_agent":"$http_user_agent"'
    '}';

  access_log /var/log/nginx/access.log json_combined;

  # ── Core ─────────────────────────────────────────────────
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  server_tokens off;
  client_max_body_size 10m;

  # ── Compression ──────────────────────────────────────────
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied expired no-cache no-store private auth;
  gzip_types text/plain text/css text/javascript application/javascript
             application/json application/xml+rss image/svg+xml;
  gzip_comp_level 5;

  # ── Rate Limiting ─────────────────────────────────────────
  # General site rate limit
  limit_req_zone $binary_remote_addr zone=general:10m rate=60r/m;
  # Tighter limit for auth endpoints
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
  # API endpoints
  limit_req_zone $binary_remote_addr zone=api:10m rate=120r/m;

  limit_req_status 429;

  # ── Upstream Services ─────────────────────────────────────
  upstream frontend {
    server frontend:3000;
    keepalive 32;
  }

  upstream backend {
    server backend:4000;
    keepalive 32;
  }

  # ── Request ID ────────────────────────────────────────────
  map $http_x_request_id $request_id_value {
    default $http_x_request_id;
    ""      $request_id;
  }

  # ── Main Server Block ─────────────────────────────────────
  server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Request-ID $request_id_value always;

    # HSTS — uncomment when TLS is active
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Health check (no rate limit) ──────────────────────
    location = /health {
      access_log off;
      return 200 '{"status":"ok","service":"nginx"}';
      add_header Content-Type application/json;
    }

    # ── API routes ────────────────────────────────────────
    location /api/auth {
      limit_req zone=auth burst=5 nodelay;
      proxy_pass http://backend;
      include /etc/nginx/proxy_params;
    }

    location /api/ {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://backend;
      include /etc/nginx/proxy_params;
    }

    # ── Metrics endpoint (internal only) ─────────────────
    location /metrics {
      # Restrict to internal network only
      allow 172.16.0.0/12;
      allow 10.0.0.0/8;
      allow 127.0.0.1;
      deny all;
      proxy_pass http://backend;
      include /etc/nginx/proxy_params;
    }

    # ── Next.js static assets ────────────────────────────
    location /_next/static/ {
      proxy_pass http://frontend;
      proxy_cache_valid 200 365d;
      add_header Cache-Control "public, max-age=31536000, immutable";
      include /etc/nginx/proxy_params;
    }

    location /_next/image {
      limit_req zone=general burst=10 nodelay;
      proxy_pass http://frontend;
      include /etc/nginx/proxy_params;
    }

    # ── Frontend (catch-all) ─────────────────────────────
    location / {
      limit_req zone=general burst=20 nodelay;
      proxy_pass http://frontend;
      include /etc/nginx/proxy_params;
    }
  }

  # ── Observability (internal access only) ─────────────────
  server {
    listen 8080;

    # Prometheus stub status for nginx metrics
    location = /nginx_status {
      stub_status on;
      access_log off;
    }
  }
}
